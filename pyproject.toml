[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tarel"
version = "0.0.6"
description = "A local-first analytics context compiler for coding agents."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "MPS" }]
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
keywords = ["analytics", "context", "metadata", "semantic-layer", "lineage", "agents"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Utilities",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/mpsgitai/tarel"
Repository = "https://github.com/mpsgitai/tarel"
Issues = "https://github.com/mpsgitai/tarel/issues"
Documentation = "https://github.com/mpsgitai/tarel/tree/master/docs"

[project.optional-dependencies]
sqlite = []
sqlserver = [
  "pymssql>=2.3,<3",
]
semantic = [
  "PyYAML>=6,<7",
]
vector = [
  "sqlite-vec==0.1.9",
]
mcp = [
  "mcp>=1.10,<3",
]
dev = [
  "build>=1.2,<2",
  "mypy>=1.15",
  "ruff>=0.11",
]

[project.scripts]
tarel = "tarel.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tarel"]

[tool.hatch.build.targets.sdist]
only-include = [
  "CONTRIBUTING.md",
  "LICENSE",
  "README.md",
  "SECURITY.md",
  "THIRD_PARTY_NOTICES.md",
  "docs",
  "pyproject.toml",
  "src",
  "tests",
  "tools/check_distribution.py",
  "tools/generate_cli_reference.py",
  "tools/generate_code_map.py",
  "tools/check_docs.py",
  "tools/readme_demo",
  "tools/run_semantic_contract_test.py",
  "tools/smoke_demo.py",
  "tools/sqlite_vec_trial.py",
]

[tool.hatch.build]
exclude = [
  "/.tarel",
  "/AGENTS.md",
  "/docs/coding-conventions.md",
  "/docs/competitors.md",
  "/docs/harness-adaptation.md",
  "/models",
  "/tests/local_databases.toml",
  "**/AGENTS.md",
  "**/*.gguf",
  "**/*.sqlite",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF", "PTH"]
# RUF001: intentional typographic characters in user-facing strings.
# PTH100: os.path.abspath keeps symlinks, Path.resolve does not; packages rely on that.
# PTH105/PTH101 in ui/ and tools/: one-off scripts and the deferred browser refactor.
ignore = ["RUF001", "PTH100"]

[tool.ruff.lint.per-file-ignores]
"src/tarel/ui/**" = ["PTH101", "PTH105"]
"tools/**" = ["PTH101", "PTH105"]

[tool.mypy]
python_version = "3.11"
files = ["src/tarel"]
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true

# Optional drivers and runtimes ship without type information.
[[tool.mypy.overrides]]
module = ["mcp", "mcp.*", "pymssql", "sqlite_vec", "yaml"]
ignore_missing_imports = true

# Type debt: modules that do not pass yet. Every other module, including all of cli/ and sdk/,
# is checked. Fix a module, then delete it from this list; never add one.
[[tool.mypy.overrides]]
module = [
  "tarel.annotations.review",
  "tarel.context.hints_application",
  "tarel.discovery.advice",
  "tarel.discovery.tasks",
  "tarel.entity_resolution.discovery",
  "tarel.expansion.projections",
  "tarel.lineage.dbt",
  "tarel.lineage.review",
  "tarel.lineage.traversal",
  "tarel.object_families.proposal_contracts",
  "tarel.retrieval.documents",
  "tarel.retrieval.index",
  "tarel.retrieval.settings",
  "tarel.semantic_concepts.application",
]
ignore_errors = true
