name: Record README demo

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/readme-demo.yml
      - tools/readme_demo/**

permissions:
  contents: read

concurrency:
  group: readme-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    name: Record Structure to Lineage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install recording tools
        run: |
          python -m pip install -e . 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Record the real GUI with synthetic metadata
        run: python tools/readme_demo/record.py --output "$RUNNER_TEMP/tarel-readme-demo"
      - name: Upload GIF, stills, video and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tarel-space-lineage-demo
          path: ${{ runner.temp }}/tarel-readme-demo
          if-no-files-found: error
          retention-days: 14
